services:
  postgres:
    image: postgres:18-alpine@sha256:54451ecb8ab38c24c3ec123f2fd501303a3a1856a5c66e98cecf2460d5e1e9d7
    platform: linux/amd64
    restart: 'no'
    read_only: true
    environment:
      POSTGRES_DB: mattermost_contract
      POSTGRES_USER: mattermost_contract
      POSTGRES_PASSWORD: disposable-contract-password
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mattermost_contract -d mattermost_contract']
      interval: 2s
      timeout: 2s
      retries: 30
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /var/run/postgresql
    volumes:
      - type: volume
        source: postgres-data
        target: /var/lib/postgresql
    networks:
      - contract

  mattermost:
    image: mattermost/mattermost-team-edition:11.7.6@sha256:f9f59fd070b33dda9485c9e6d3249f5f0036720efecbd0c76d45f71c29291456
    platform: linux/amd64
    restart: 'no'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      MM_SQLSETTINGS_DRIVERNAME: postgres
      MM_SQLSETTINGS_DATASOURCE: postgres://mattermost_contract:disposable-contract-password@postgres:5432/mattermost_contract?sslmode=disable&connect_timeout=10
      MM_BLEVESETTINGS_INDEXDIR: /mattermost/bleve-indexes
      MM_SERVICESETTINGS_SITEURL: http://127.0.0.1:8065
      MM_SERVICESETTINGS_LISTENADDRESS: :8065
      MM_SERVICESETTINGS_ENABLEUSERACCESSTOKENS: 'true'
      MM_SERVICESETTINGS_ENABLEBOTACCOUNTCREATION: 'true'
      MM_SERVICESETTINGS_ENABLELOCALMODE: 'false'
      MM_TEAMSETTINGS_ENABLEOPENSERVER: 'true'
      MM_EMAILSETTINGS_SENDEMAILNOTIFICATIONS: 'false'
      MM_LOGSETTINGS_ENABLECONSOLE: 'true'
      MM_LOGSETTINGS_CONSOLELEVEL: ERROR
    ports:
      - name: mattermost-http
        target: 8065
        published: '8065'
        host_ip: 127.0.0.1
        protocol: tcp
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
    volumes:
      - type: volume
        source: mattermost-config
        target: /mattermost/config
      - type: volume
        source: mattermost-data
        target: /mattermost/data
      - type: volume
        source: mattermost-logs
        target: /mattermost/logs
      - type: volume
        source: mattermost-plugins
        target: /mattermost/plugins
      - type: volume
        source: mattermost-client-plugins
        target: /mattermost/client/plugins
      - type: volume
        source: mattermost-bleve
        target: /mattermost/bleve-indexes
    networks:
      - contract

volumes:
  postgres-data:
  mattermost-config:
  mattermost-data:
  mattermost-logs:
  mattermost-plugins:
  mattermost-client-plugins:
  mattermost-bleve:

networks:
  contract:
    internal: true
